name: Build IceFishing Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          unzip -q IceFishingAITracker-Android-Source.zip -d project
          cp -a project/app .
          cp project/build.gradle.kts .
          cp project/gradle.properties .
          cp project/settings.gradle.kts .

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IceFishingAITracker
          path: app/build/outputs/apk/debug/app-debug.apk
